[package]
name = "artef"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "TUI code editor and runner for Termux (aarch64 Android)"
license = "MIT"

[dependencies]
crossterm = "0.28.1"
ratatui = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
