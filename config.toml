workdir = ""

[editor]
# block | underline | letters
cursor = ""

[theme]
# пустая строка, "reset" или "default" = цвет терминала; либо #rrggbb
background = ""
panel = ""
border = ""
active_bg = ""
accent = ""
folder = ""
file = ""
python = ""
rust = ""
javascript = ""
go = ""
ghost = ""
status_bg = ""
status_fg = ""
key = ""
error = ""
output = ""
line_number = ""
selection = ""
search = ""
muted = ""
keyword = ""
type_color = ""
string = ""
comment = ""
number = ""
function = ""
macro_color = ""
operator = ""
property = ""
heading = ""
link = ""
code = ""
tag = ""
key_color = ""

[shortcuts]
save = "ctrl+s"
run = "ctrl+r"
find = "ctrl+f"
find_next = "f3"
goto = "ctrl+g"
copy = "ctrl+c"
paste = "ctrl+v"
undo = "ctrl+z"
redo = "ctrl+y"
quit = "ctrl+shift+q, ctrl+q"
quit_alt = "f10, alt+q"
new_file = "f6, ctrl+n"
new_folder = "f7"
new_folder_alt = "alt+n"
delete = "d, delete"
focus_tree = "ctrl+b"
focus_output = "ctrl+o"
workdir = "ctrl+w"
wrap_toggle = "alt+w"
refresh = "f5"
accept_ghost = "tab"

[run]
".py" = "{python} -u {file}"
".js" = "{node} {file}"
".ts" = "{tsx} {file}"
".rs" = "{cargo} run --release"
".go" = "{go} run {file}"
".c" = "{cc} {file} -o {temp} && {temp}"
".cpp" = "{cxx} {file} -o {temp} && {temp}"
".sh" = "{bash} {file}"
