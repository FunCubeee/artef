workdir = ""

[theme]
background = "#1d2021"
panel = "#282828"
border = "#3c3836"
active_bg = "#32302f"
accent = "#b8bb26"
folder = "#fabd2f"
file = "#ebdbb2"
python = "#458588"
rust = "#d65d0e"
javascript = "#b8bb26"
go = "#83a598"
ghost = "#504945"
status_bg = "#3c3836"
status_fg = "#ebdbb2"
key = "#83a598"
error = "#fb4934"
output = "#d5c4a1"
line_number = "#665c54"
selection = "#504945"
search = "#665c54"
muted = "#928374"
keyword = "#fb4934"
type_color = "#fabd2f"
string = "#b8bb26"
comment = "#928374"
number = "#d3869b"
function = "#83a598"
macro_color = "#fabd2f"
operator = "#a89984"
property = "#83a598"
heading = "#b8bb26"
link = "#83a598"
code = "#fabd2f"
tag = "#8ec07c"
key_color = "#83a598"

[shortcuts]
save = "ctrl+s"
run = "ctrl+r"
find = "ctrl+f"
find_next = "f3"
goto = "ctrl+g"
copy = "ctrl+c"
paste = "ctrl+v"
undo = "ctrl+z"
redo = "ctrl+y"
quit = "ctrl+shift+q, ctrl+q"
quit_alt = "f10, alt+q"
new_file = "f6, ctrl+n"
new_folder = "f7"
new_folder_alt = "alt+n"
delete = "d, delete"
focus_tree = "ctrl+b"
focus_output = "ctrl+o"
workdir = "ctrl+w"
wrap_toggle = "alt+w"
refresh = "f5"
accept_ghost = "tab"

[run]
".py" = "{python} -u {file}"
".js" = "{node} {file}"
".ts" = "{tsx} {file}"
".rs" = "{cargo} run --release"
".go" = "{go} run {file}"
".c" = "{cc} {file} -o {temp} && {temp}"
".cpp" = "{cxx} {file} -o {temp} && {temp}"
".sh" = "{bash} {file}"
